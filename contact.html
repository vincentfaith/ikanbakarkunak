<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ikan Bakar Kunak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0c0c0c; color: #ffffff; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .accent-orange { color: #d35400; }
        .input-field { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 1rem; border-radius: 0.75rem; width: 100%; outline: none; color: white; }
        .input-field:focus { border-color: #d35400; }
        .order-summary-box { background: rgba(211, 84, 0, 0.05); border: 1px dashed #d35400; padding: 1.5rem; border-radius: 1rem; }
    </style>
</head>
<body>
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-xl font-bold tracking-tighter uppercase"><span class="accent-orange">Ikan Bakar</span> Kunak</span>
        </div>
        <div class="hidden md:flex gap-8 text-sm font-light uppercase tracking-widest">
            <a href="index.html" class="hover:text-orange-400 transition">Home</a>
            <a href="menu.html" class="hover:text-orange-400 transition">Menu</a>
            <a href="about.html" class="hover:text-orange-400 transition">Experience</a>
            <a href="contact.html" class="accent-orange font-bold">Contact</a>
        </div>
        <a href="menu.html" class="bg-orange-600 text-white px-6 py-2 rounded-full text-xs font-bold uppercase">Back to Menu</a>
    </nav>

    <section class="pt-40 pb-20 px-6 md:px-20 max-w-4xl mx-auto">
        <div class="text-center mb-12">
            <h2 class="text-4xl md:text-6xl font-serif italic mb-4">Finalize <span class="accent-orange not-italic">Order</span></h2>
            <p class="text-gray-500 italic">Sila lengkapkan maklumat di bawah untuk tempahan dan pesanan anda.</p>
        </div>

        <!-- ORDER SUMMARY DISPLAY -->
        <div id="summary-container" class="mb-10 hidden">
            <div class="order-summary-box">
                <h3 class="font-bold uppercase text-xs tracking-widest mb-4 accent-orange">Ringkasan Pesanan Anda:</h3>
                <div id="order-list" class="space-y-2 text-sm text-gray-300">
                    <!-- Items injected by JS -->
                </div>
                <div class="border-t border-orange-900/30 mt-4 pt-4 flex justify-between font-bold">
                    <span>JUMLAH KESELURUHAN:</span>
                    <span id="order-total" class="text-orange-500">RM 0.00</span>
                </div>
            </div>
        </div>
        
        <form id="orderForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="name" placeholder="Full Name" class="input-field" required>
                <input type="tel" id="phone" placeholder="Phone Number (e.g. 0123456789)" class="input-field" required>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="date" id="date" class="input-field text-gray-400" required>
                <input type="number" id="guests" placeholder="No. of Guests" class="input-field" required>
            </div>
            <textarea id="requests" placeholder="Special Requests (Optional: e.g. Less spicy, birthday celebration)" rows="4" class="input-field"></textarea>
            
            <button type="submit" class="w-full bg-[#d35400] py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-orange-700 transition shadow-lg flex justify-center items-center gap-2">
                <span>Confirm & Send to WhatsApp</span>
            </button>
        </form>
    </section>

    <script>
        // 1. Tarik data dari LocalStorage yang kita simpan di menu.html
        const savedData = JSON.parse(localStorage.getItem('customerOrder'));
        
        if (savedData && savedData.items.length > 0) {
            document.getElementById('summary-container').classList.remove('hidden');
            const listContainer = document.getElementById('order-list');
            
            savedData.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between border-b border-white/5 pb-1';
                div.innerHTML = `<span>${item.name} (x${item.quantity})</span> <span>RM ${(item.price * item.quantity).toFixed(2)}</span>`;
                listContainer.appendChild(div);
            });
            
            document.getElementById('order-total').innerText = savedData.total;
        }

        // 2. Fungsi handle form submission
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Ambil data input
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;
            const guests = document.getElementById('guests').value;
            const requests = document.getElementById('requests').value || "Tiada";

            // Format Mesej WhatsApp
            let message = `*TEMPAHAN BARU - IKAN BAKAR KUNAK*\n`;
            message += `--------------------------------\n`;
            message += `*Nama:* ${name}\n`;
            message += `*No. Tel:* ${phone}\n`;
            message += `*Tarikh:* ${date}\n`;
            message += `*Bil. Orang:* ${guests} pax\n\n`;

            if (savedData && savedData.items.length > 0) {
                message += `*SENARAI PESANAN:*\n`;
                savedData.items.forEach((item, index) => {
                    message += `${index + 1}. ${item.name} (x${item.quantity}) - RM ${(item.price * item.quantity).toFixed(2)}\n`;
                });
                message += `\n*TOTAL: ${savedData.total}*\n`;
            } else {
                message += `*Pesanan:* Hanya booking meja sahaja.\n`;
            }

            message += `\n*Permintaan Khas:* ${requests}\n`;
            message += `--------------------------------\n`;
            message += `Sila sahkan tempahan saya. Terima kasih!`;

            // Encode mesej untuk URL
            const encodedMessage = encodeURIComponent(message);
            
            // Ganti nombor di bawah dengan nombor WhatsApp restaurant kau (mesti start dengan 60)
            const whatsappNumber = "60123456789"; 
            
            // Redirect ke WhatsApp
            window.location.href = `https://wa.me/${60199876843}?text=${encodedMessage}`;
        });
    </script>
</body>
</html>
